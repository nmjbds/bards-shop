<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — Bards Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#0A0A0A;--white:#FAFAFA;--gray-50:#F9F9F7;--gray-100:#F2F2F0;--gray-200:#E4E4E2;--gray-300:#C8C8C6;--gray-400:#8A8A88;--gray-600:#4A4A48;--orange:#FF4F00;--red:#C8001A;--green:#16A34A;--blue:#2563EB;--sidebar:220px;--radius:14px;--radius-sm:10px;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Space Grotesk',sans-serif;background:var(--gray-100);color:var(--black);display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar);background:var(--black);min-height:100vh;position:fixed;top:0;left:0;z-index:100;display:flex;flex-direction:column;}
.sb-brand{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-brand .logo{font-family:'Bebas Neue';font-size:20px;letter-spacing:3px;color:#fff;}
.sb-brand .sub{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto;}
.sb-section{font-size:8.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.25);padding:10px 8px 5px;}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;color:rgba(255,255,255,.55);text-decoration:none;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;white-space:nowrap;}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.sb-item.active{background:rgba(255,255,255,.13);color:#fff;}
.sb-item svg{flex-shrink:0;}
.sb-foot{padding:12px 10px;border-top:1px solid rgba(255,255,255,.07);}
.sb-profile{display:flex;align-items:center;gap:9px;padding:9px 10px;background:rgba(255,255,255,.06);border-radius:9px;}
.sb-avatar{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-family:'Bebas Neue';font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.sb-avatar img{width:100%;height:100%;object-fit:cover;}
.sb-uname{font-size:11.5px;font-weight:600;color:#fff;line-height:1.2;}
.sb-urole{font-size:9.5px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.8px;}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--white);border-bottom:1px solid var(--gray-200);height:58px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.page-title{font-family:'Bebas Neue';font-size:19px;letter-spacing:2px;}
.content{padding:22px 24px;flex:1;}

/* Filter bar */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-tab{height:30px;padding:0 13px;border:1.5px solid var(--gray-200);border-radius:20px;background:var(--white);color:var(--gray-600);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;gap:5px;}
.filter-tab:hover{border-color:var(--gray-400);}
.filter-tab.active{background:var(--black);border-color:var(--black);color:#fff;}
.filter-count{font-family:'DM Mono',monospace;font-size:9px;opacity:.7;}
.search-wrap{margin-left:auto;position:relative;}
.search-input{height:32px;padding:0 12px 0 32px;border:1.5px solid var(--gray-200);border-radius:20px;background:var(--white);font-family:'Space Grotesk',sans-serif;font-size:12px;outline:none;color:var(--black);width:220px;transition:border-color .15s;}
.search-input:focus{border-color:var(--black);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray-400);pointer-events:none;}

/* Table */
.table-wrap{background:var(--white);border:1.5px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;}
.table-head{display:grid;grid-template-columns:1fr 110px 80px 110px 100px 130px;gap:10px;padding:11px 18px;background:var(--gray-50);border-bottom:1px solid var(--gray-200);}
.table-head span{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray-400);}
.cust-row{display:grid;grid-template-columns:1fr 110px 80px 110px 100px 130px;gap:10px;padding:12px 18px;border-bottom:1px solid var(--gray-100);align-items:center;}
.cust-row:last-child{border-bottom:none;}
.cust-row.suspended-row{opacity:.6;}
.cust-cell{display:flex;align-items:center;gap:10px;min-width:0;}
.cust-avatar{width:32px;height:32px;border-radius:50%;background:var(--gray-100);color:var(--gray-600);font-family:'Bebas Neue';font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.cust-avatar img{width:100%;height:100%;object-fit:cover;}
.cust-info{min-width:0;}
.cust-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cust-email{font-size:10.5px;color:var(--gray-400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cust-date{font-size:11px;color:var(--gray-400);}
.cust-num{font-family:'DM Mono',monospace;font-size:12.5px;font-weight:600;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
.b-active{background:#DCFCE7;color:var(--green);}
.b-suspended{background:#FEE2E2;color:var(--red);}
.act-btn{height:30px;padding:0 13px;border-radius:8px;border:1.5px solid var(--gray-200);background:var(--white);color:var(--gray-600);font-size:11px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:opacity .15s;}
.act-btn:hover{opacity:.75;}
.act-suspend{color:var(--red);border-color:var(--red);}
.act-reactivate{color:var(--green);border-color:var(--green);}

.empty{padding:56px 20px;text-align:center;color:var(--gray-400);}
.empty-icon{font-size:32px;margin-bottom:10px;}
.empty-title{font-size:14px;font-weight:600;color:var(--black);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--black);color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;font-weight:500;z-index:9999;opacity:0;transition:opacity .25s,transform .25s;transform:translateY(4px);pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);}
.toast.on{opacity:1;transform:translateY(0);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .32s ease both;}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand"><div class="logo">BARDS</div><div class="sub">Admin Hub</div></div>
  <nav class="sb-nav">
    <div class="sb-section">Platform</div>
    <a href="/admin-shops" class="sb-item"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Shops</a>
    <a href="/admin-orders" class="sb-item"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>Orders</a>
    <a href="/admin-stats" class="sb-item"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Stats</a>
    <a href="/admin-categories" class="sb-item"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 3h7v7H3z"/><path d="M14 3h7v7h-7z"/><path d="M14 14h7v7h-7z"/><path d="M3 14h7v7H3z"/></svg>Categories</a>
    <a href="/admin-customers" class="sb-item active"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Customers</a>
    <a href="/admin-products" class="sb-item"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>Products</a>
    <div class="sb-section">Account</div>
    <a href="/seller" class="sb-item" id="hubSellerLink"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Seller Hub</a>
    <a href="/" class="sb-item" id="hubViewStoreLink"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>View Store</a>
    <button class="sb-item" onclick="Auth.logout()"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</button>
  </nav>
  <div class="sb-foot">
    <div class="sb-profile">
      <div class="sb-avatar" id="sbAvatar">A</div>
      <div><div class="sb-uname" id="sbName">Loading…</div><div class="sb-urole">Admin</div></div>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="page-title">Customers</div>
  </div>
  <div class="content">
    <div class="filter-bar fu">
      <button class="filter-tab active" onclick="setFilter('all',this)">All <span class="filter-count" id="cnt-all"></span></button>
      <button class="filter-tab" onclick="setFilter('active',this)">Active <span class="filter-count" id="cnt-active"></span></button>
      <button class="filter-tab" onclick="setFilter('suspended',this)">Suspended <span class="filter-count" id="cnt-suspended"></span></button>
      <div class="search-wrap">
        <svg class="search-icon" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" placeholder="Search name / email…" oninput="onSearch(this.value)">
      </div>
    </div>

    <div class="table-wrap fu">
      <div class="table-head">
        <span>Customer</span><span>Joined</span><span>Orders</span><span>Spent</span><span>Status</span><span></span>
      </div>
      <div id="custList"></div>
      <div class="empty" id="emptyState" style="display:none">
        <div class="empty-icon">👤</div>
        <div class="empty-title">No customers in this view</div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="/api.js"></script>
<script src="/products.js"></script>
<script>
let _customers = [];
let _filter = 'all';
let _search = '';

document.addEventListener('DOMContentLoaded', async () => {
  if (!(await Auth.ensureSession())) { location.href = bardsSigninUrl('/admin-customers'); return; }
  try {
    const { user } = await AuthAPI.me();
    if (user.role !== 'admin') { location.href = bardsCrossHubUrl('main', '/'); return; }
    document.getElementById('sbName').textContent = user.name || 'Admin';
    const av = document.getElementById('sbAvatar');
    if (user.avatar) { av.innerHTML = `<img src="${escapeHtml(user.avatar)}" alt="">`; }
    else { av.textContent = (user.name || 'A')[0].toUpperCase(); }
    document.getElementById('hubSellerLink').href = bardsCrossHubUrl('seller', '/seller');
    document.getElementById('hubViewStoreLink').href = bardsCrossHubUrl('main', '/');
  } catch(e) { location.href = bardsSigninUrl(); return; }
  await loadCustomers();
});

async function loadCustomers() {
  try {
    const d = await apiFetch('/seller/customers', { auth:true });
    _customers = d.customers || [];
  } catch(e) {
    toast('❌ Cannot load customers: ' + e.message);
    _customers = [];
  }
  renderCounts();
  renderList();
}

function renderCounts() {
  document.getElementById('cnt-all').textContent = _customers.length;
  document.getElementById('cnt-active').textContent = _customers.filter(c => c.status !== 'suspended').length;
  document.getElementById('cnt-suspended').textContent = _customers.filter(c => c.status === 'suspended').length;
}

function setFilter(f, el) {
  _filter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function onSearch(v) {
  _search = v.trim().toLowerCase();
  renderList();
}

function visibleCustomers() {
  return _customers.filter(c => {
    if (_filter === 'active' && c.status === 'suspended') return false;
    if (_filter === 'suspended' && c.status !== 'suspended') return false;
    if (_search && !(c.name || '').toLowerCase().includes(_search) && !(c.email || '').toLowerCase().includes(_search)) return false;
    return true;
  });
}

function initials(name) {
  return (name || '?').trim().charAt(0).toUpperCase();
}

function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); }
  catch(e) { return ''; }
}

function renderList() {
  const list = document.getElementById('custList');
  const empty = document.getElementById('emptyState');
  const items = visibleCustomers();
  if (!items.length) { list.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  list.innerHTML = items.map(c => rowHTML(c)).join('');
}

function rowHTML(c) {
  const suspended = c.status === 'suspended';
  const avatar = c.avatar
    ? `<img src="${escapeHtml(c.avatar)}" alt="">`
    : escapeHtml(initials(c.name));
  const badge = suspended
    ? `<span class="badge b-suspended">Suspended</span>`
    : `<span class="badge b-active">Active</span>`;
  const actBtn = suspended
    ? `<button class="act-btn act-reactivate" onclick="setStatus('${c.id}','active')">Reactivate</button>`
    : `<button class="act-btn act-suspend" onclick="setStatus('${c.id}','suspended')">Suspend</button>`;
  return `
<div class="cust-row${suspended ? ' suspended-row' : ''}">
  <div class="cust-cell">
    <div class="cust-avatar">${avatar}</div>
    <div class="cust-info">
      <div class="cust-name">${escapeHtml(c.name)}</div>
      <div class="cust-email">${escapeHtml(c.email || '')}</div>
    </div>
  </div>
  <div class="cust-date">${fmtDate(c.joined)}</div>
  <div class="cust-num">${c.total_orders}</div>
  <div class="cust-num">$${Number(c.total_spent || 0).toFixed(2)}</div>
  <div>${badge}</div>
  <div>${actBtn}</div>
</div>`;
}

async function setStatus(id, status) {
  if (status === 'suspended' && !confirm('Suspend this account? They will be signed out everywhere and unable to sign back in until reactivated.')) return;
  try {
    await apiFetch(`/seller/customers/${id}/status`, { method:'PATCH', body:{ status }, auth:true });
    toast(status === 'suspended' ? '✓ Account suspended' : '✓ Account reactivated');
    await loadCustomers();
  } catch(e) {
    toast('❌ ' + e.message);
  }
}

let _tt;
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(_tt);
  _tt = setTimeout(() => t.classList.remove('on'), 2400);
}
</script>
</body>
</html>
